services:
  richierich-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: richierich-web
    restart: always
    ports:
      # Map host port 80 to container port 80 (change to 3000:80 if you run an external reverse proxy)
      - "80:80"
    environment:
      - NODE_ENV=production
    # Resource safety limits to keep your VPS responsive
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
