services:
  # -------------------------------------------------------------
  # 1. Richie Rich Frontend SPA (Vite + Nginx)
  # -------------------------------------------------------------
  richierich:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_POCKETBASE_URL=
    container_name: richierich
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - pocketbase

  # -------------------------------------------------------------
  # 2. PocketBase Real-Time Backend & SQLite Database Engine
  # -------------------------------------------------------------
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: richierich-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    environment:
      - POCKETBASE_ENCRYPTION_KEY=
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pb_data:
    driver: local
