services:
  # -------------------------------------------------------------
  # 1. Richie Rich Frontend SPA (Vite + Nginx)
  # -------------------------------------------------------------
  richierich:
    image: ghcr.io/agphotographyin-dot/richierich:latest
    container_name: richierich
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - pocketbase
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------
  # 2. PocketBase Real-Time Backend & SQLite Database Engine
  # -------------------------------------------------------------
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: richierich-pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pb_data:
    driver: local
