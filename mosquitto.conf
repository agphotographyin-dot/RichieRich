# ==============================================================================
# Eclipse Mosquitto Configuration for Richie Rich Pan House Enterprise POS
# Supports High-Speed Real-time POS Counter Sync, Hardware Peripherals & Web App
# ==============================================================================

# Standard TCP listener for POS Hardware (Thermal Printers, Barcode Scanners, ESP32, Weighing Scales)
listener 1883 0.0.0.0
allow_anonymous true

# WebSockets listener for Web Browsers, Tablets, Mobile Phones & Electron POS
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Performance and connection tuning
max_connections -1
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_dest stdout

# Topic format documentation:
# - richierich/pos/orders/new
# - richierich/pos/inventory/update
# - richierich/pos/hardware/printer/counter1
# - richierich/pos/hardware/cashdrawer/trigger
